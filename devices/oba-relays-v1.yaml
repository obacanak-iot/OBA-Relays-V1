substitutions:
  device_name: oba-relays-v1
  friendly_name: OBA Relays V1
  firmware_version: "1.0.5"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: obacanak.oba_relays_v1
    version: ${firmware_version}

esp8266:
  board: esp01_1m

logger:
  baud_rate: 0

api:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

http_request:
  verify_ssl: false

ota:
  - platform: esphome

  - platform: http_request

uart:
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 115200

switch:
  - platform: template
    name: "${friendly_name} Role1"
    id: role1
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - uart.write: [0xA0, 0x01, 0x01, 0xA2]
    turn_off_action:
      - uart.write: [0xA0, 0x01, 0x00, 0xA1]

  - platform: template
    name: "${friendly_name} Role2"
    id: role2
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - uart.write: [0xA0, 0x02, 0x01, 0xA3]
    turn_off_action:
      - uart.write: [0xA0, 0x02, 0x00, 0xA2]

update:
  - platform: http_request
    name: "${friendly_name} Firmware Update"
    source: "https://github.com/obacanak-iot/OBA-Relays-V1/releases/latest/download/manifest.json"

text_sensor:
  - platform: template
    name: "${friendly_name} Firmware Version"
    icon: mdi:chip
    entity_category: diagnostic
    lambda: |-
      return {"${firmware_version}"};
