name: Build OBA Relays V1 Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build ESPHome firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ESPHome secrets file
        run: |
          cat > devices/secrets.yaml <<EOF
          wifi_ssid: "DUMMY_WIFI"
          wifi_password: "DUMMY_PASSWORD"
          EOF

      - name: Build firmware
        uses: esphome/build-action@v6
        with:
          yaml-file: devices/oba-relays-v1.yaml

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: oba-relays-v1-firmware
          path: |
            *.bin
            **/*.bin
            **/manifest.json
