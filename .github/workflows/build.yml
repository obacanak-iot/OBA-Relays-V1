name: Build OBA Relays V1 Firmware

on:
  push:
    branches:
      - main
    paths-ignore:
      - manifest.json
      - firmware/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ESPHome firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate version consistency
        run: |
          set -euo pipefail

          VERSION_FILE=$(tr -d '[:space:]' < VERSION)
          YAML_VERSION=$(grep 'firmware_version:' devices/oba-relays-v1.yaml | sed 's/.*"\(.*\)".*/\1/')
          MANIFEST_VERSION=$(grep '"version"' manifest.json | head -n 1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')

          echo "VERSION=$VERSION_FILE"
          echo "YAML firmware_version=$YAML_VERSION"
          echo "Manifest version=$MANIFEST_VERSION"

          test "$VERSION_FILE" = "$YAML_VERSION"
          test "$VERSION_FILE" = "$MANIFEST_VERSION"

      - name: Create ESPHome secrets file for compile check only
        run: |
          cat > devices/secrets.yaml <<EOF
          wifi_ssid: "DUMMY_WIFI"
          wifi_password: "DUMMY_PASSWORD"
          EOF

      - name: Build firmware compile check
        uses: esphome/build-action@v6
        with:
          yaml-file: devices/oba-relays-v1.yaml

      - name: Do not publish CI firmware
        run: |
          echo "CI firmware is compiled only to validate YAML."
          echo "It contains dummy WiFi credentials and must not be published as OTA firmware."
