name: Build OBA Relays V1 Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ESPHome firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ESPHome secrets file
        run: |
          cat > devices/secrets.yaml <<EOF
          wifi_ssid: "DUMMY_WIFI"
          wifi_password: "DUMMY_PASSWORD"
          EOF

      - name: Build firmware
        uses: esphome/build-action@v6
        with:
          yaml-file: devices/oba-relays-v1.yaml

      - name: Prepare release files
        run: |
          VERSION=$(grep 'firmware_version:' devices/oba-relays-v1.yaml | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p release
          find . -name "*.ota.bin" -exec cp {} release/oba-relays-v1-esp8266.ota.bin \;
          find . -name "manifest.json" -exec cp {} release/manifest.json \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: OBA Relays V1 Firmware ${{ env.VERSION }}
          body: OBA Relays V1 firmware release ${{ env.VERSION }}
          files: |
            release/manifest.json
            release/oba-relays-v1-esp8266.ota.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
