[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 115200
upload_speed = 115200
extra_scripts = pre:scripts/check_versions.py
lib_deps =
  tzapu/WiFiManager@^2.0.17
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.0.4
build_flags =
  -D PRODUCT_NAME=\"OBA-Relays-V1\"
  -D PRODUCT_MODEL=\"OBA-RELAYS-ESP01-V1\"
  -D FIRMWARE_VERSION=\"1.0.9\"
  -D UPDATE_MANIFEST_URL=\"https://obacanak-iot.github.io/OBA-Relays-V1/oba-relays-v1/version.json\"
  -D CONFIG_PORTAL_TIMEOUT_SECONDS=180
